# GitHub Pages: artefacto liviano + una sola cola de deploy.
# Tras el primer push, en Settings → Pages → Source elige "GitHub Actions"
# (desactiva el workflow automático pages-build-deployment del branch).

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *' # 9:00 AM Bogota time

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site (exclude dev-only paths)
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='bin' \
            --exclude='Makefile' \
            --exclude='QUICKSTART.md' \
            --exclude='QUICKSTART.save.md' \
            --exclude='quickstart-guide.md' \
            --exclude='content/relatividad-gravitacion/figures/figures.pptx' \
            --exclude='content/relatividad-gravitacion/figures/animations/introduccion_seno (1).html' \
            --exclude='content/relatividad-gravitacion/figures/animations/introduccion_seno (2).html' \
            ./ _site/
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Máximo efectivo ~10 min (límite backend de Pages).
          timeout: 600000
          reporting_interval: 10000

  notify:
    # Enviar correos de reseñas nuevas DESPUÉS de que el deploy haya terminado,
    # para que los enlaces en el correo ya apunten a contenido publicado.
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Notify new reviews
        env:
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REVIEW_NOTIFY_TOKEN: ${{ secrets.REVIEW_NOTIFY_TOKEN }}
        run: |
          python3 bin/notify_new_reviews.py || echo "notify_new_reviews omitido o falló."

      - name: Commit notify state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add info/review-notify-state.json info/sync-state.json 2>/dev/null || true
          if ! git diff --cached --quiet 2>/dev/null; then
            git commit -m "chore: update review notify state ($(date +'%Y-%m-%d %H:%M:%S %Z'))"
            git push
          fi
