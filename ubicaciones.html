<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Ubicación de libros — Jorge I. Zuluaga</title>
  <link rel="icon" type="image/png" sizes="48x48" href="./assets/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/style.css?v=2" />
  <link rel="stylesheet" href="./assets/booklocation.css" />
  <script src="./assets/template.js" defer></script>
</head>

<body class="photos-page library-page booklocation-page">
  <div class="wrapper">
    <header id="header" class="photos-header">
      <div class="photos-header__bar">
        <a class="link photos-back" href="./biblioteca.html">← Volver a Biblioteca</a>
        <button class="theme-button photos-theme" type="button" aria-label="Modo de visualización: Claro/Oscuro">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="moon-icon" aria-hidden="true">
            <path d="M11.3807 2.01886C9.91573 3.38768 9 5.3369 9 7.49999C9 11.6421 12.3579 15 16.5 15C18.6631 15 20.6123 14.0843 21.9811 12.6193C21.6613 17.8537 17.3149 22 12 22C6.47715 22 2 17.5228 2 12C2 6.68514 6.14629 2.33869 11.3807 2.01886Z"></path>
          </svg>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="sun-icon" aria-hidden="true">
            <path d="M12 18C8.68629 18 6 15.3137 6 12C6 8.68629 8.68629 6 12 6C15.3137 6 18 8.68629 18 12C18 15.3137 15.3137 18 12 18ZM11 1H13V4H11V1ZM11 20H13V23H11V20ZM3.51472 4.92893L4.92893 3.51472L7.05025 5.63604L5.63604 7.05025L3.51472 4.92893ZM16.9497 18.364L18.364 16.9497L20.4853 19.0711L19.0711 20.4853L16.9497 18.364ZM19.0711 3.51472L20.4853 4.92893L18.364 7.05025L16.9497 5.63604L19.0711 3.51472ZM5.63604 16.9497L7.05025 18.364L4.92893 20.4853L3.51472 19.0711L5.63604 16.9497ZM23 11V13H20V11H23ZM4 11V13H1V11H4Z"></path>
          </svg>
        </button>
      </div>
    </header>

    <main class="photos-main">
      <div class="container bl">
        <h1 class="title-section">Ubicación de libros</h1>

        <nav class="bl-tabs" role="tablist" aria-label="Secciones">
          <button class="bl-btn" role="tab" data-tab="search" aria-selected="true">Buscar</button>
          <button class="bl-btn" role="tab" data-tab="assign" aria-selected="false">Asignar</button>
          <button class="bl-btn" role="tab" data-tab="locs" aria-selected="false">Ubicaciones</button>
        </nav>

        <div id="status" class="bl-muted" role="status" aria-live="polite"></div>

        <form id="token-box" class="bl-card bl-token" hidden>
          <label for="token-input"><strong>Token de acceso</strong></label>
          <p class="bl-muted">Se guarda solo en este navegador.</p>
          <div class="bl-row">
            <input id="token-input" type="password" autocomplete="current-password" placeholder="Token" required />
            <button class="bl-btn bl-primary" type="submit">Entrar</button>
          </div>
        </form>

        <section id="scanner" hidden>
          <video id="video" playsinline muted></video>
          <div class="bl-row"><button class="bl-btn" id="scan-stop" type="button">Cerrar cámara</button></div>
        </section>

        <section id="tab-search">
          <div class="bl-row">
            <input id="q" type="search" placeholder="Título, autor o ISBN" autocomplete="off" />
            <button id="q-scan" class="bl-btn bl-primary" type="button" aria-label="Escanear">📷</button>
          </div>
          <div id="results"></div>
        </section>

        <section id="tab-assign" hidden>
          <!-- Paso 1: escoger ubicación -->
          <div id="as-loc" hidden>
            <h2 class="bl-h2">Escoge la ubicación</h2>
            <p class="bl-muted">Escanea la etiqueta QR de la ubicación o elígela aquí abajo.</p>
            <div class="bl-row">
              <select id="as-loc-select" aria-label="Ubicación"></select>
              <button class="bl-btn bl-primary" id="as-loc-use" type="button">Usar</button>
            </div>
            <button class="bl-btn" id="as-loc-cancel" type="button" hidden>Cancelar</button>
          </div>

          <!-- Paso 2: ubicación elegida y lista de libros -->
          <div id="as-main" hidden>
            <div class="bl-card">
              <div class="bl-muted">Ubicación</div>
              <div id="cur-loc" class="bl-loc"></div>
              <div class="bl-row"><button class="bl-btn" id="as-change" type="button">Cambiar ubicación</button></div>
            </div>
            <button class="bl-btn bl-primary bl-wide" id="as-new" type="button">＋ Nuevo libro</button>
            <div id="a-log"></div>
            <h2 id="a-books-title" class="bl-h2"></h2>
            <div id="a-books-list"></div>
          </div>

          <!-- Paso 3: escanear o escribir el ISBN -->
          <div id="as-isbn" hidden>
            <h2 class="bl-h2">Escanea el libro</h2>
            <p class="bl-muted">Apunta al código de barras del ISBN o escríbelo aquí abajo.</p>
            <div class="bl-row">
              <input id="as-isbn-input" placeholder="ISBN" inputmode="numeric" autocomplete="off" />
              <button class="bl-btn bl-primary" id="as-isbn-go" type="button">Buscar</button>
            </div>
            <button class="bl-btn" id="as-isbn-cancel" type="button">Cancelar</button>
          </div>

          <!-- Paso 4: ficha del libro -->
          <form id="as-form" class="bl-card bl-form" hidden>
            <div class="bl-book">
              <div id="af-cover"></div>
              <div class="bl-book__body">
                <strong>ISBN <span id="af-isbn"></span></strong>
                <div id="af-note" class="bl-muted"></div>
              </div>
            </div>
            <label for="af-title">Título</label>
            <input id="af-title" autocomplete="off" />
            <label for="af-author">Autor</label>
            <input id="af-author" autocomplete="off" />
            <label for="af-loc">Ubicación</label>
            <select id="af-loc"></select>
            <div class="bl-row">
              <button class="bl-btn bl-primary" type="submit">Guardar</button>
              <button class="bl-btn" id="af-cancel" type="button">Cancelar</button>
              <button class="bl-btn" id="af-remove" type="button" hidden>Quitar</button>
            </div>
          </form>
        </section>

        <section id="tab-locs" hidden>
          <div class="bl-row">
            <input id="l-name" placeholder="Nombre (ej. Estudio, estante 2)" />
            <button id="l-add" class="bl-btn bl-primary" type="button">Crear</button>
          </div>
          <p class="bl-row" id="l-sheet-row" hidden>
            <button class="bl-btn" id="l-sheet-png" type="button">⬇ Descargar etiquetas</button>
            <button class="bl-btn" id="l-sheet-print" type="button">🖨 Imprimir todas</button>
          </p>
          <div id="l-list"></div>
          <div id="l-label" class="bl-label" hidden></div>
          <div id="l-sheet" class="bl-sheet" hidden></div>
          <div class="bl-row" id="l-print-row" hidden><button class="bl-btn" id="l-print" type="button">🖨 Imprimir etiqueta</button></div>
          <p><button class="bl-btn" id="reset-token" type="button">Salir</button></p>
        </section>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" defer></script>
  <script src="./assets/booklocation-page.js" defer></script>
</body>

</html>
